/* 版面：前台是一欄式邀請函（封面、宴席資訊、相簿、動態回覆表單）；後台是四個分頁（基本資料、圖片、問題、回覆）加底部發布列。 */
:root {
  --bg: #fbf6f4;
  --surface: #ffffff;
  --fg: #2b1a1e;
  --muted: #7a6469;

  --soft: #f6ebe8;
  --accent: #8c2433;
  --accent-fg: #ffffff;
  --cover: #7e1d2c;
  --on-cover: #fff4ee;
  --gold: #a8802f;
  --gold-on-cover: #e3c27a;
  --danger: #b3261e;
  --ok: #2f6b4a;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1215;
    --surface: #281a1e;
    --fg: #f4e8e6;
    --muted: #bfa7ab;
    --line: #4a3338;
    --soft: #33212a;
    --accent: #b83a4e;
    --cover: #5e1624;
    --gold: #d2ae62;
    --danger: #ff9a92;
    --ok: #7fcf9f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1215;

  --danger: #ff9a92;
  --ok: #7fcf9f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 var(--sans);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 24px; }
.wrap > *, #front > *, #admin > * { min-width: 0; }
#front, #admin { display: grid; gap: 24px; }
[hidden] { display: none !important; }
.sr { position: absolute; left: -9999px; }

/* 主辦人切換列 */
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--soft); border-radius: 8px; padding: 8px 8px 8px 16px; }
.modebar span { font-weight: 700; color: var(--muted); font-size: 14px; letter-spacing: 0.1em; }
.seg { display: flex; gap: 4px; }
.seg button { font: 500 14px/1 var(--sans); padding: 10px 14px; border-radius: 6px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }

/* 封面 */
.cover { position: relative; background: var(--cover); color: var(--on-cover); text-align: center; border-radius: 6px; overflow: hidden; }
.cover-img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.cover-body { position: relative; padding: 40px 24px 38px; }
.cover:not(.has-img)::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--gold-on-cover); opacity: 0.55; border-radius: 3px; pointer-events: none; }
.cover .xi { font: 900 56px/1 var(--serif); color: var(--gold-on-cover); margin: 0 0 12px; }
.cover .eyebrow { margin: 0; letter-spacing: 0.35em; font-size: 14px; opacity: 0.9; }
.cover h1 { font: 700 clamp(28px, 7vw, 38px)/1.3 var(--serif); letter-spacing: 0.06em; margin: 10px 0 14px; text-wrap: balance; overflow-wrap: anywhere; }
.cover .lead { margin: 0 auto; max-width: 24em; font-size: 15px; opacity: 0.92; text-wrap: balance; white-space: pre-line; }

/* 宴席資訊與相簿 */
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 20px; margin: 0; }
.info div { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.info div:last-child { border-bottom: 0; }
.info dt { color: var(--gold); font-weight: 700; letter-spacing: 0.15em; }
.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.info dd small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--soft); }

.cd-label { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.3em; opacity: 0.88; }
.countdown { display: flex; justify-content: center; gap: 10px; }
