<title>劉錦鴻 & 洪晨茗 婚宴邀請函</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：前台是一欄式邀請函（封面、宴席資訊、相簿、動態回覆表單）；後台是四個分頁（基本資料、圖片、問題、回覆）加底部發布列。 */
:root {
  --bg: #fbf6f4;
  --surface: #ffffff;
  --fg: #2b1a1e;
  --muted: #7a6469;
  --line: #e8dad7;
  --soft: #f6ebe8;
  --accent: #8c2433;
  --accent-fg: #ffffff;
  --cover: #7e1d2c;
  --on-cover: #fff4ee;
  --gold: #a8802f;
  --gold-on-cover: #e3c27a;
  --danger: #b3261e;
  --ok: #2f6b4a;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1215;
    --surface: #281a1e;
    --fg: #f4e8e6;
    --muted: #bfa7ab;
    --line: #4a3338;
    --soft: #33212a;
    --accent: #b83a4e;
    --cover: #5e1624;
    --gold: #d2ae62;
    --danger: #ff9a92;
    --ok: #7fcf9f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1215;
  --surface: #281a1e;
  --fg: #f4e8e6;
  --muted: #bfa7ab;
  --line: #4a3338;
  --soft: #33212a;
  --accent: #b83a4e;
  --cover: #5e1624;
  --gold: #d2ae62;
  --danger: #ff9a92;
  --ok: #7fcf9f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 var(--sans);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 24px; }
.wrap > *, #front > *, #admin > * { min-width: 0; }
#front, #admin { display: grid; gap: 24px; }
[hidden] { display: none !important; }
.sr { position: absolute; left: -9999px; }

/* 主辦人切換列 */
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--soft); border-radius: 8px; padding: 8px 8px 8px 16px; }
.modebar span { font-weight: 700; color: var(--muted); font-size: 14px; letter-spacing: 0.1em; }
.seg { display: flex; gap: 4px; }
.seg button { font: 500 14px/1 var(--sans); padding: 10px 14px; border-radius: 6px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }

/* 封面 */
.cover { position: relative; background: var(--cover); color: var(--on-cover); text-align: center; border-radius: 6px; overflow: hidden; }
.cover-img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.cover-body { position: relative; padding: 40px 24px 38px; }
.cover:not(.has-img)::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--gold-on-cover); opacity: 0.55; border-radius: 3px; pointer-events: none; }
.cover .xi { font: 900 56px/1 var(--serif); color: var(--gold-on-cover); margin: 0 0 12px; }
.cover .eyebrow { margin: 0; letter-spacing: 0.35em; font-size: 14px; opacity: 0.9; }
.cover h1 { font: 700 clamp(28px, 7vw, 38px)/1.3 var(--serif); letter-spacing: 0.06em; margin: 10px 0 14px; text-wrap: balance; overflow-wrap: anywhere; }
.cover .lead { margin: 0 auto; max-width: 24em; font-size: 15px; opacity: 0.92; text-wrap: balance; white-space: pre-line; }

/* 宴席資訊與相簿 */
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 20px; margin: 0; }
.info div { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.info div:last-child { border-bottom: 0; }
.info dt { color: var(--gold); font-weight: 700; letter-spacing: 0.15em; }
.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.info dd small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--soft); }
.cdwrap { margin-top: 22px; }
.cd-label { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.3em; opacity: 0.88; }
.countdown { display: flex; justify-content: center; gap: 10px; }
.cd { min-width: 62px; background: rgba(0, 0, 0, 0.28); border-radius: 6px; padding: 8px 6px 6px; }
.cd b { display: block; font: 700 24px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.cd span { font-size: 12px; letter-spacing: 0.15em; opacity: 0.85; }
.cd-note { margin: 22px 0 0; font: 700 18px/1.4 var(--serif); letter-spacing: 0.1em; color: var(--gold-on-cover); }
.mapbar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
a.btn { text-decoration: none; text-align: center; }
.seatcard { text-align: center; }
.seatcard .big { font: 900 44px/1.2 var(--serif); color: var(--gold); margin: 6px 0 8px; overflow-wrap: anywhere; }
.card .blk h3 { margin: 0 0 6px; }
.blk + .blk { border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 18px; }
.blkbody { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }

/* 卡片與表單 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px 20px; }
.card h2 { font: 700 22px/1.4 var(--serif); margin: 0 0 4px; text-wrap: balance; }
.card h3 { font: 700 17px/1.4 var(--serif); margin: 0 0 12px; }
.card .sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; white-space: pre-line; }
.field { display: grid; gap: 6px; margin-bottom: 18px; }
.field > label, .field > .lbl, .lbl { font-weight: 700; font-size: 15px; }
.req { color: var(--danger); }
.hint { color: var(--muted); font-size: 13px; margin-top: -2px; }
.opt { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
input[type="text"], input[type="number"], textarea, select {
  width: 100%;
  font: inherit;
  font-size: 16px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px 14px;
}
textarea { min-height: 88px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qimg { max-width: 100%; border-radius: 6px; display: block; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.choice span { display: block; text-align: center; padding: 13px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-weight: 500; overflow-wrap: anywhere; }
.choice input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.rowfield { margin-bottom: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 700; font-size: 15px; }
.row .t small { color: var(--muted); font-size: 13px; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 500 20px/1 var(--sans); cursor: pointer; }
.stepper button:active { background: var(--soft); }
.stepper output { min-width: 2.2ch; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

.btn { width: 100%; font: 700 17px/1 var(--sans); letter-spacing: 0.15em; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 6px; padding: 16px; cursor: pointer; }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.small { width: auto; padding: 11px 16px; font-size: 15px; letter-spacing: 0.06em; display: inline-block; text-align: center; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); letter-spacing: 0.08em; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ghost { color: var(--gold); border-color: var(--gold); } }
:root[data-theme="dark"] .btn.ghost { color: var(--gold); border-color: var(--gold); }
.err { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 0 0 8px; }

/* 回覆確認 */
.done h2 { color: var(--ok); }
.status { margin: 0 0 16px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin: 0 0 14px; font: 15px/1.8 var(--sans); user-select: all; }
.actions { display: grid; gap: 10px; }
.flash { text-align: center; color: var(--ok); font-size: 14px; min-height: 1.4em; margin: 8px 0 0; }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }

/* 後台 */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { flex: none; font: 500 15px/1 var(--sans); padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar select { width: auto; }
.note { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.msg-err { color: var(--danger); font-size: 14px; margin: 8px 0 0; }
.qcard { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; background: var(--bg); }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.qhead .qno { font-weight: 700; color: var(--gold); margin-right: auto; }
.qhead select { width: auto; padding: 8px 10px; font-size: 14px; }
.qhead button { font: 500 14px/1 var(--sans); padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.qhead button.danger { color: var(--danger); border-color: var(--danger); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
.thumb { display: grid; gap: 6px; }
.thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--soft); display: block; }
.thumb button { font: 500 13px/1 var(--sans); padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--danger); cursor: pointer; }
.upl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.upl input[type="file"] { position: absolute; left: -9999px; }
.savebar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar span { font-size: 14px; color: var(--muted); }
.savebar span.warn { color: var(--danger); }
.savebar span.good { color: var(--ok); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--soft); border-radius: 6px; padding: 12px 14px; }
.tile b { display: block; font: 700 26px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.stat { background: var(--soft); border-radius: 6px; padding: 12px 14px; }
.stat b { display: block; font-size: 14px; margin-bottom: 6px; overflow-wrap: anywhere; }
.stat div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.stat div span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; }
.scroller { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 500; }
.empty { color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .choice span, .seg button { transition: background 0.15s, border-color 0.15s; }
}
</style>

<main class="wrap">
  <nav class="modebar" id="modebar" hidden aria-label="主辦人模式">
    <span>主辦人</span>
    <div class="seg">
      <button type="button" id="mode-admin" aria-pressed="false">後台管理</button>
      <button type="button" id="mode-front" aria-pressed="true">前台預覽</button>
    </div>
  </nav>

  <div id="front">
    <header class="cover" id="cover">
      <img class="cover-img" id="cover-img" alt="" hidden>
      <div class="cover-body">
        <p class="xi" aria-hidden="true">囍</p>
        <p class="eyebrow">We're Married! 誠摯邀請</p>
        <h1 id="c-names"></h1>
        <p class="lead" id="c-lead"></p>
        <div class="cdwrap" id="cdwrap" hidden>
          <p class="cd-label">距離婚宴還有</p>
          <div class="countdown" id="countdown" role="timer" aria-label="婚宴倒數"></div>
        </div>
        <p class="cd-note" id="cd-note" hidden></p>
      </div>
    </header>

    <dl class="info" id="info"></dl>
    <div class="mapbar" id="mapbar" hidden></div>
    <section class="card" id="blocks" hidden></section>
    <div class="gallery" id="gallery" hidden></div>
    <section class="card seatcard" id="seat-card" aria-labelledby="seat-title" hidden>
      <h2 id="seat-title">您的座位</h2>
      <p class="big" id="seat-no"></p>
      <p class="sub" style="margin:0">請依桌卡入座，找不到座位時可詢問現場服務人員。</p>
    </section>

    <section class="card" id="form-card" aria-labelledby="form-title">
      <h2 id="form-title"></h2>
      <p class="sub" id="form-sub"></p>
      <form id="rsvp" novalidate>
        <div id="qs"></div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit" id="submit">送出回覆</button>
      </form>
    </section>

    <section class="card done" id="done-card" aria-labelledby="done-title" hidden>
      <h2 id="done-title">回覆已整理好</h2>
      <p class="status" id="status"></p>
      <pre class="reply" id="reply"></pre>
      <div class="actions">
        <button class="btn" type="button" id="copy">複製回覆內容</button>
        <button class="btn ghost" type="button" id="edit">修改回覆</button>
      </div>
      <p class="flash" id="flash" role="status"></p>
    </section>

    <p class="foot" id="foot"></p>
  </div>

  <div id="admin" hidden>
    <div class="tabs" role="tablist" aria-label="後台分頁">
      <button type="button" role="tab" id="tab-basic" data-tab="basic" aria-selected="true">基本資料</button>
      <button type="button" role="tab" id="tab-info" data-tab="info" aria-selected="false">交通與資訊</button>
      <button type="button" role="tab" id="tab-img" data-tab="img" aria-selected="false">圖片</button>
      <button type="button" role="tab" id="tab-q" data-tab="q" aria-selected="false">問題</button>
      <button type="button" role="tab" id="tab-resp" data-tab="resp" aria-selected="false">回覆</button>
    </div>
    <section class="card" id="p-basic" role="tabpanel"></section>
    <section class="card" id="p-info" role="tabpanel" hidden></section>
    <section class="card" id="p-img" role="tabpanel" hidden></section>
    <section class="card" id="p-q" role="tabpanel" hidden></section>
    <section class="card" id="p-resp" role="tabpanel" hidden></section>
    <div class="savebar" id="savebar">
      <span id="save-msg">所有修改都已發布</span>
      <button class="btn small" type="button" id="save" disabled>儲存並發布</button>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var blobUrl = function (id) { return "/_blob/" + id; };
  var TYPES = { text: "單行文字", longtext: "多行文字", number: "數字", single: "單選", multi: "複選" };

  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === false || v == null) return;
      if (k === "text") el.textContent = v;
      else if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }

  // ---------- 預設內容（已依喜帖插畫更新）----------
  var DEFAULT_CFG = {
    v: 1,
    event: {
      names: "劉錦鴻（村村） & 洪晨茗",
      lead: "Welcome to our wedding!\n我們要結婚了，歡迎來參加我們的婚禮，與我們共享喜宴。",
      date: "2027 年 3 月 6 日（六）",
      time: "11:30 迎賓簽到\n12:00 迎賓雞尾酒會\n12:30 午宴用餐",
      venue: "大倉久和大飯店",
      address: "臺北市中山區康樂里南京東路一段9號",
      deadline: "2027 年 2 月 6 日前",
      formTitle: "出席回覆",
      formSub: "請告訴我們您是否出席，方便我們安排座位與餐點。",
      footer: "劉錦鴻 & 洪晨茗 期待與您相見",
      mapUrl: "",
      eventAt: "2027-03-06T12:30"
    },
    coverId: null,
    gallery: [],
    blocks: [
      { id: "b_traffic", title: "交通方式", body: "捷運：搭乘淡水信義線或松山新店線至「中山站」，3 號出口步行約 3 分鐘。\n公車：搭乘至「南京林森路口」站下車即達。" },
      { id: "b_parking", title: "停車資訊", body: "飯店備有地下停車場（由林森北路巷弄進入），喜宴賓客可享免費停車折抵。\n週末車位較緊，建議提早抵達或搭乘大眾運輸。" }
    ],
    questions: [
      { id: "q_name", type: "text", label: "姓名", hint: "", required: true, isName: true },
      { id: "q_phone", type: "text", label: "聯絡電話", hint: "選填", required: false },
      { id: "q_side", type: "single", label: "您是哪一方的賓客？", hint: "", required: false, options: ["新郎方（錦鴻／村村）", "新娘方（晨茗）"] },
      { id: "q_att", type: "single", label: "是否出席？", hint: "", required: true, options: ["歡喜出席", "無法出席"] },
      { id: "q_adults", type: "number", label: "成人人數", hint: "含您本人", required: true, min: 1, max: 10, showIf: { q: "q_att", eq: "歡喜出席" } },
      { id: "q_kids", type: "number", label: "兒童人數", hint: "12 歲以下，需要兒童椅請計入", required: false, min: 0, max: 6, showIf: { q: "q_att", eq: "歡喜出席" } },
      { id: "q_veg", type: "number", label: "素食人數", hint: "含在上述人數內", required: false, min: 0, max: 16, showIf: { q: "q_att", eq: "歡喜出席" } },
      { id: "q_diet", type: "text", label: "飲食禁忌", hint: "例如：不吃牛、海鮮過敏", required: false, showIf: { q: "q_att", eq: "歡喜出席" } },
      { id: "q_msg", type: "longtext", label: "給新人的話", hint: "寫下您的祝福", required: false }

      cv.height = Math.round(bmp.height * s);
      var ctx = cv.getContext("2d");

      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(bmp, 0, 0, cv.width, cv.height);

    if (code === "quota_or_state") return "儲存空間已滿，請先移除不用的圖片。";

  // ---------- 儲存並發布 ----------
  function assetIds(c) {
    var s = new Set();
    if (c.coverId) s.add(c.coverId);
    c.gallery.forEach(function (x) { s.add(x); });
    c.questions.forEach(function (q) { if (q.imageId) s.add(q.imageId); });
    return s;
  }
  function sanitize() {
    var c = clone(draft);
    for (var i = 0; i < c.questions.length; i++) {
      var q = c.questions[i];
      q.label = q.label.trim();
      q.hint = q.hint.trim();
      if (!q.label) return { error: "第 " + (i + 1) + " 題還沒有填題目。", at: q.id };
      if (q.type === "single" || q.type === "multi") {
        q.options = q.options.map(function (s) { return s.trim(); }).filter(Boolean);
        if (q.options.length < 2) return { error: "第 " + (i + 1) + " 題的選項至少要有兩個。", at: q.id };
      } else { q.options = []; }
      if (q.type === "number" && q.max < q.min) q.max = q.min;
      if (q.showIf && q.options && !c.questions.some(function (x) { return x.id === q.showIf.q; })) q.showIf = null;
    }
    if (!c.questions.length) return { error: "至少要有一個問題。", at: null };
    c.blocks = c.blocks.map(function (b) { return { id: b.id, title: b.title.trim(), body: b.body.trim() }; }).filter(function (b) { return b.title || b.body; });
    c.event.mapUrl = (c.event.mapUrl || "").trim();
    if (c.event.mapUrl && !safeUrl(c.event.mapUrl)) return { error: "地圖連結需要以 https:// 開頭。", at: null, tab: "basic" };
    return { cfg: c };
  }

  $("save").addEventListener("click", async function () {

      updateSavebar(r.error, "warn");

    try {

      updateSavebar("已發布，賓客重新開啟頁面就會看到。", "good");

      }

      $("save").disabled = false;
    }
  });

  // ---------- 啟動 ----------

  capsP.then(function (c) {
    if (c.db) {
      try {
        c.db.doc("config/main").onSnapshot(function (snap) {
          if (!snap.exists) return;
          cfg = normalize(snap.data());
          if (!dirty) draft = clone(cfg);
          if (mode === "front") renderFront(); else if (!dirty) renderAdmin();
        }, function () {});
      } catch (e) {}
    }
    if (c.db) {
      try {
        c.db.doc("config/seats").onSnapshot(function (snap) {
          seatsOpen = snap.exists && !!(snap.data() || {}).open;
          renderSeat();
          if (mode === "admin" && tab === "resp") buildResponses();
        }, function () {});
        if (c.uid) {
          c.db.doc("seats/" + c.uid).onSnapshot(function (snap) {
            mySeat = snap.exists ? snap.data() : null;
            renderSeat();
          }, function () {});
        }
      } catch (e) {}
    }
    if (c.canEdit) {
      $("modebar").hidden = false;
      draft = clone(cfg);
      if (c.db) {
        var timer = setTimeout(function () { if (respState === "loading") { respState = "error"; buildResponses(); } }, 10000);
        try {
          c.db.collection("rsvps").orderBy("at", "desc").onSnapshot(function (snap) {
            clearTimeout(timer);
            respState = "ok";
            responses = snap.docs.map(function (d) { return { id: d.id, data: d.data() || {} }; });
            if (document.activeElement && document.activeElement.classList.contains("seat-in")) return;
            buildResponses();
          }, function () { clearTimeout(timer); respState = "error"; buildResponses(); });
        } catch (e) { respState = "error"; }
        try {
          c.db.collection("seats").onSnapshot(function (snap) {
            seatsMap = {};
            snap.docs.forEach(function (d) { seatsMap[d.id] = (d.data() || {}).table || ""; });
            var t = $("t-seated");
            if (t) t.textContent = seatedCount() + "/" + responses.length;
          }, function () {});
        } catch (e) {}
      }
      setMode("admin");
    } else {
      var prev = lsGet();
      if (prev && prev.answers && prev.text) {
        ans = prev.answers;
        renderForm();
        showDone(prev.text, !!prev.saved);
        window.scrollTo(0, 0);
      }
    }
  });
})();
</script>
