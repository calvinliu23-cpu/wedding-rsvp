<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劉錦鴻 & 洪晨茗 婚宴邀請函</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6f4; --surface: #ffffff; --fg: #2b1a1e; --muted: #7a6469;
  --line: #e8dad7; --soft: #f6ebe8; --accent: #8c2433; --cover: #7e1d2c;
  --on-cover: #fff4ee; --gold: #a8802f; --danger: #b3261e; --ok: #2f6b4a;
  --serif: "Noto Serif TC", serif; --sans: "Noto Sans TC", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.7 var(--sans); padding: 20px 16px 48px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 24px; }
.cover { background: var(--cover); color: var(--on-cover); text-align: center; border-radius: 6px; padding: 40px 24px; }
.cover .xi { font: 900 56px/1 var(--serif); color: #e3c27a; margin: 0 0 12px; }
.cover h1 { font: 700 32px/1.3 var(--serif); margin: 10px 0 14px; }
.cover .lead { white-space: pre-line; font-size: 15px; opacity: 0.92; }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 20px; }
.info div { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.info div:last-child { border-bottom: 0; }
.info dt { color: var(--gold); font-weight: 700; }
.info dd { margin: 0; white-space: pre-line; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px 20px; }
.card h2 { font: 700 22px/1.4 var(--serif); margin: 0 0 4px; }
.card .sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
.field { display: grid; gap: 6px; margin-bottom: 18px; }
.field > .lbl { font-weight: 700; font-size: 15px; }
.req { color: var(--danger); }
.hint { color: var(--muted); font-size: 13px; }
input[type="text"], input[type="number"], textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px;
}
textarea { min-height: 88px; resize: vertical; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.choice span { display: block; text-align: center; padding: 13px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-weight: 500; }
.choice input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 20px; cursor: pointer; }
.stepper output { min-width: 2.2ch; text-align: center; font-weight: 700; font-size: 18px; }
.btn { width: 100%; font: 700 17px var(--sans); letter-spacing: 0.15em; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.err { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 0 0 8px; }
.done h2 { color: var(--ok); }
.reply { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin: 0 0 14px; font-size: 15px; user-select: all; }
.actions { display: grid; gap: 10px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <div id="front">
    <header class="cover">
      <p class="xi">囍</p>
      <p class="eyebrow">We're Married! 誠摯邀請</p>
      <h1 id="c-names"></h1>
      <p class="lead" id="c-lead"></p>
    </header>
    <dl class="info" id="info"></dl>
    <div class="gallery" id="gallery">
      <img src="LEE_6229 (1).jpg" alt="婚紗照 1" loading="lazy">
      <img src="LEE_5881.jpg" alt="婚紗照 2" loading="lazy">
    </div>
    <section class="card" id="form-card">
      <h2 id="form-title">出席回覆</h2>
      <p class="sub">請告訴我們您是否出席，方便我們安排座位與餐點。</p>
      <form id="rsvp" novalidate>
        <div id="qs"></div>
        <p class="err" id="err"></p>
        <button class="btn" type="submit" id="submit-btn">送出回覆</button>
      </form>
    </section>
    <section class="card done" id="done-card" hidden>
      <h2>回覆已整理好</h2>
      <p>你的回覆已經送達新人，謝謝你！</p>
      <pre class="reply" id="reply"></pre>
      <div class="actions">
        <button class="btn" type="button" id="copy">複製回覆內容</button>
        <button class="btn ghost" type="button" id="edit">修改回覆</button>
      </div>
      <p id="flash" style="color:var(--ok); text-align:center; font-size:14px; margin-top:8px;"></p>
    </section>
    <p class="foot">劉錦鴻 & 洪晨茗 期待與您相見</p>
  </div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  
  $("c-names").textContent = "劉錦鴻（村村） & 洪晨茗";
  $("c-lead").textContent = "Welcome to our wedding!\n我們要結婚了，歡迎來參加我們的婚禮，與我們共享喜宴。";

  var info = $("info");
  [
    ["日期", "2027 年 3 月 6 日（六）"],
    ["時間", "11:30 迎賓簽到\n12:00 迎賓雞尾酒會\n12:30 午宴用餐"],
    ["地點", "大倉久和大飯店\n臺北市中山區康樂里南京東路一段9號"],
    ["回覆期限", "2027 年 2 月 6 日前"]
  ].forEach(function (r) {
    var div = document.createElement("div");
    var dt = document.createElement("dt"); dt.textContent = r[0];
    var dd = document.createElement("dd"); dd.textContent = r[1];
    div.appendChild(dt); div.appendChild(dd);
    info.appendChild(div);
  });

  var questions = [
    { id: "q_name", type: "text", label: "姓名", required: true },
    { id: "q_phone", type: "text", label: "聯絡電話", hint: "選填", required: false },
    { id: "q_side", type: "single", label: "您是哪一方的賓客？", options: ["新郎方（錦鴻／村村）", "新娘方（晨茗）"] },
    { id: "q_att", type: "single", label: "是否出席？", required: true, options: ["歡喜出席", "無法出席"] },
    { id: "q_adults", type: "number", label: "出席的「成人」人數", hint: "含您本人", required: true, min: 1, max: 10 },
    { id: "q_kids", type: "number", label: "出席的「兒童」人數", hint: "12 歲以下，需要兒童椅請計入", min: 0, max: 6 },
    { id: "q_veg", type: "number", label: "是否準備素食？需要幾份呢？", hint: "含在上述人數內", min: 0, max: 10 },
    { id: "q_address", type: "longtext", label: "請提供您的收件資料，讓我們寄喜帖給您", hint: "收件人 / 地址 / 電話" },
    { id: "q_msg", type: "longtext", label: "希望您給我們一些祝福....", hint: "寫下您的祝福" }
  ];

  var ans = {};
  var box = $("qs");

  questions.forEach(function (q) {
    var wrap = document.createElement("div");
    wrap.className = "field";
    var reqMark = q.required ? " *" : "";

    if (q.type === "number") {
      wrap.className = "field rowfield";
      if (typeof ans[q.id] !== "number") ans[q.id] = q.min;
      var row = document.createElement("div"); row.className = "row";
      var infoDiv = document.createElement("div");
      var lbl = document.createElement("b"); lbl.className = "lbl"; lbl.textContent = q.label + reqMark;
      infoDiv.appendChild(lbl);
      if (q.hint) {
        var sm = document.createElement("small"); sm.className = "hint"; sm.style.display = "block"; sm.textContent = q.hint;
        infoDiv.appendChild(sm);
      }
      var stepper = document.createElement("div"); stepper.className = "stepper";
      var out = document.createElement("output"); out.textContent = String(ans[q.id]);

      var btnMinus = document.createElement("button"); btnMinus.type = "button"; btnMinus.textContent = "−";
      btnMinus.onclick = function() {
        ans[q.id] = Math.max(q.min, Math.min(q.max, ans[q.id] - 1));
        out.textContent = String(ans[q.id]);
      };
      var btnPlus = document.createElement("button"); btnPlus.type = "button"; btnPlus.textContent = "+";
      btnPlus.onclick = function() {
        ans[q.id] = Math.max(q.min, Math.min(q.max, ans[q.id] + 1));
        out.textContent = String(ans[q.id]);
      };

      stepper.appendChild(btnMinus); stepper.appendChild(out); stepper.appendChild(btnPlus);
      row.appendChild(infoDiv); row.appendChild(stepper);
      wrap.appendChild(row);
    } else {
      var isInput = q.type === "text" || q.type === "longtext";
      var lbl = document.createElement(isInput ? "label" : "span");
      lbl.className = "lbl"; lbl.textContent = q.label + reqMark;
      if (isInput) lbl.htmlFor = "q-" + q.id;
      wrap.appendChild(lbl);

      if (q.hint) {
        var hint = document.createElement("span"); hint.className = "hint"; hint.style.display = "block"; hint.textContent = q.hint;
        wrap.appendChild(hint);
      }

      if (isInput) {
        var inp = document.createElement(q.type === "text" ? "input" : "textarea");
        inp.id = "q-" + q.id;
        if (q.type === "text") inp.type = "text";
        inp.oninput = function(e) { ans[q.id] = e.target.value; };
        wrap.appendChild(inp);
      } else {
        var g = document.createElement("div"); g.className = "choices";
        q.options.forEach(function (o) {
          var label = document.createElement("label"); label.className = "choice";
          var ci = document.createElement("input"); ci.type = "radio"; ci.name = "q-" + q.id; ci.value = o;
          ci.onchange = function() { ans[q.id] = o; };
          var span = document.createElement("span"); span.textContent = o;
          label.appendChild(ci); label.appendChild(span);
          g.appendChild(label);
        });
        wrap.appendChild(g);
      }
    }
    box.appendChild(wrap);
  });

  $("rsvp").onsubmit = async function (e) {
    e.preventDefault();
    var err = $("err"); err.textContent = "";
    var out = [];
    var payload = {};

    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var v = ans[q.id];
      if (q.type === "number" && typeof v !== "number") v = q.min;
      if (typeof v === "string") v = v.trim();
      var empty = v == null || v === "";
      if (empty && q.required) {
        err.textContent = "請回答「" + q.label + "」。";
        return;
      }
      if (!empty) {
        out.push(q.label + "：" + v);
        payload[q.label] = v;
      }
    }

    var submitBtn = $("submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "傳送中…";

    try {
      // 串接你的 Google Apps Script 網址
      await fetch("https://script.google.com/macros/s/AKfycbypXtxhjs-scoegQRJ5gEDtbXu6D5lprwO9Ed_I9-c4XQjJTIiTlPpkh8NJ-h6SLzjk/exec", {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.error(err);
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "送出回覆";

    $("reply").textContent = "【婚宴回覆】\n" + out.join("\n");
    $("form-card").hidden = true;
    $("done-card").hidden = false;
  };

  $("copy").onclick = async function () {
    try {
      await navigator.clipboard.writeText($("reply").textContent);
      $("flash").textContent = "已成功複製回覆內容！";
    } catch (e) {
      $("flash").textContent = "複製失敗，請手動複製。";
    }
  };

  $("edit").onclick = function () {
    $("done-card").hidden = true;
    $("form-card").hidden = false;
  };
})();
</script>
</body>
</html>
